name: CI

# PR-time verification. Two jobs:
#
#   offline  -- the full no-network battery: panel + provenance + registry
#               suites, the tests/ suite (cite goldens, publish checks,
#               decoupling pins), the data gate, byte-identity rebuilds,
#               and the node app.js harnesses. Stdlib python + node only.
#
#   browser  -- the three Playwright walkers (readers + panel feature
#               harness x bundled and user-extended data), which need a
#               real Chrome.
#
# No paths filter on purpose: a filtered required check never reports on PRs
# outside its paths, which blocks merging once branch protection requires it.
# The offline job is cheap (~1 min); always-on beats clever here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The python side is stdlib-only by design (validate_data.py falls
      # back to its built-in schema checker when jsonschema is absent), so
      # the runner's preinstalled python3 is all it needs.
      - name: Panel + provenance suites
        run: |
          python3 engine/panel/test_panel.py
          python3 engine/panel/test_new_behaviour.py
          python3 engine/panel/test_verify_panel_provenance.py
          python3 engine/panel/verify_panel_provenance.py

      - name: Registry, citation, and decoupling suites
        run: python3 -m unittest discover -s tests

      - name: Data gate + builder byte-identity
        run: |
          python3 engine/test_validate_data.py
          python3 engine/validate_data.py
          python3 engine/test_builders_fail_loud.py
          python3 engine/test_builders_reproduce_payloads.py

      - name: Publish checks (every published behaviour)
        run: |
          python3 engine/publish-coverage.py research/sweeps/01-no-sycophancy --check
          python3 engine/publish-coverage.py research/sweeps/02-calibration --check
          python3 engine/publish-coverage.py research/sweeps/03-action-honesty --check

      - name: Registry drift gate
        run: python3 engine/generate_behaviour_constants.py --check

      - name: app.js resolution harnesses
        run: |
          node engine/panel/test_appjs_fallthrough.js
          node engine/panel/test_appjs_tiers.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up pnpm + Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (playwright-core)
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Reader view walkers
        run: |
          node engine/verify-spec-reader.mjs
          node engine/verify-reader-test.mjs

      - name: Panel feature harness (bundled + user-extended)
        run: node engine/verify-panel-features.mjs
