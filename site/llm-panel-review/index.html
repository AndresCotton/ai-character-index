<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The spec reader with passages scored for behaviour relevance by a panel of frontier models.">
  <meta name="robots" content="noindex">
  <title>LLM panel review · AI Character Index</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>§</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-palette="daylight">
  <a class="skip-link" href="#document-reader">Skip to document</a>

  <header class="site-header">
    <a class="wordmark" href="../">AI Character Index</a>
    <nav aria-label="Primary navigation">
      <a href="../">The index</a>
      <a href="../spec-reader/">Spec reader</a>
      <a href="../spec-reader-test/">Reader test</a>
      <a class="active" href="./" aria-current="page">LLM panel review</a>
      <a href="../methodology.html">Methodology</a>
      <button class="mode" id="mode" type="button" aria-label="Switch to the umber night surface">☾</button>
    </nav>
  </header>

  <main class="app-shell">
    <aside class="behaviour-sidebar" aria-label="Behaviors under test">
      <div class="sidebar-intro">
        <h1 class="eyebrow">LLM panel review</h1>
      </div>
      <div id="behaviour-toolbar" class="behaviour-toolbar" hidden>
        <span id="behaviour-count" class="behaviour-count" aria-live="polite">0 selected</span>
        <span class="behaviour-toolbar-actions">
          <button id="select-all-behaviours" type="button">All</button>
          <button id="clear-behaviours" type="button">None</button>
        </span>
      </div>
      <div id="behaviour-list" class="behaviour-list"></div>
      <div id="sidebar-export" class="sidebar-export">
        <button
          id="download-passages"
          class="download-passages"
          type="button"
          title="Download a Markdown file with each ticked behavior's definition and every passage it cites, in both specifications."
        >
          <span aria-hidden="true">↓</span> Download passages
        </button>
        <span id="download-hint" class="download-hint"></span>
      </div>
      <div class="sidebar-key">
        <span><i class="key-swatch core"></i> Core</span>
        <span><i class="key-swatch related"></i> Related</span>
        <span><i class="key-swatch overlap"></i> Shared</span>
        <span title="Rows in the General Guidelines group carry a broken margin rule rather than a solid one: they are defined by a filter over the specs, so their passages bear on the subject without ever naming it."><i class="key-swatch stipple"></i> Guideline</span>
      </div>
    </aside>

    <div
      id="sidebar-resizer"
      class="column-resizer sidebar-resizer"
      role="separator"
      aria-label="Resize behavior menu"
      aria-orientation="vertical"
      aria-valuemin="200"
      aria-valuemax="480"
      tabindex="0"
    ></div>

    <section class="workspace" aria-label="Specification reader">
      <div class="reader-toolbar">
        <div class="spec-switcher" role="group" aria-label="Choose specification">
          <button class="spec-option active" data-spec="anthropic" type="button">
            <span>Anthropic</span>
            <small>Constitution · 2026.01.20</small>
          </button>
          <button class="spec-option" data-spec="openai" type="button">
            <span>OpenAI</span>
            <small>Model Spec · 2025.12.18</small>
          </button>
        </div>

        <div class="view-actions">
          <button id="compare-toggle" class="compare-toggle" type="button" aria-pressed="false">
            <span class="split-icon" aria-hidden="true"></span>
            Compare
          </button>
          <a id="source-link" class="source-link" href="#" target="_blank" rel="noopener">Original ↗</a>
        </div>
      </div>

      <div class="finding-bar" aria-live="polite">
        <div>
          <span class="finding-behaviour" id="finding-behaviour">Loading…</span>
          <span class="finding-definition" id="finding-definition"></span>
        </div>
        <div class="passage-controls">
          <span id="passage-count">Loading passages…</span>
          <button id="previous-passage" type="button" aria-label="Previous highlighted passage">↑</button>
          <button id="next-passage" type="button" aria-label="Next highlighted passage">↓</button>
        </div>
      </div>

      <div id="reader-status" class="reader-status" role="status"></div>
      <div id="document-reader" class="document-grid" tabindex="-1"></div>
    </section>
  </main>

  <template id="document-template">
    <article class="document-panel">
      <header class="document-header">
        <div>
          <p class="document-lab"></p>
          <h2 class="document-title"></h2>
        </div>
        <div class="document-meta">
          <span class="coverage-depth"></span>
          <span class="document-version"></span>
          <button class="document-focus-toggle" type="button" aria-pressed="false">Expand all</button>
          <span class="rail-legend" aria-label="Passage marker legend">
            <i class="legend-mark core" aria-hidden="true"></i> Core
            <i class="legend-mark adjacent" aria-hidden="true"></i> Related
          </span>
        </div>
      </header>
      <div class="document-scroll">
        <div class="passage-rail" role="navigation" aria-label="Highlighted passages in this document"></div>
        <div class="document-body"></div>
      </div>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
